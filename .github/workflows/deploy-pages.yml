name: Deploy OKINAWA SELECT
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 20 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select products from the official Rakuten API
        env:
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: npm run update:products
      - name: Test selection logic
        run: npm test
      - name: Validate affiliate links
        id: affiliate_check
        continue-on-error: true
        run: npm run validate:affiliate-links
      - name: Save affiliate link inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: affiliate-link-check
          path: reports/affiliate-link-check.json
          retention-days: 30
      - name: Stop when an affiliate link is abnormal
        if: steps.affiliate_check.outcome == 'failure'
        run: exit 1
      - name: Prepare manual ROOM posting queue
        run: npm run build:room-queue
      - name: Verify daily generated outputs
        run: npm run verify:daily-output
      - name: Save ROOM posting queue
        uses: actions/upload-artifact@v4
        with:
          name: room-post-queue
          path: |
            reports/room-post-queue.*
          retention-days: 30
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        env:
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
        run: |
          mkdir _site
          cp index.html privacy.html styles.css product-enhancements.css favicon.svg app.js privacy.js products.js rakuten-client.js rakuten-products.js robots.txt sitemap.xml _site/
          cp -r assets _site/assets
          node <<'NODE'
          const fs=require('node:fs');
          const config={
            roomUrl:'https://room.rakuten.co.jp/room_d527155c00/items',
            instagramUrl:'https://www.instagram.com/okinawa_gurumetabi/',
            siteUrl:'https://motoki-okinawa.github.io/okinawa-select',
            contactEmail:'',
            contactUrl:'https://github.com/motoki-okinawa/okinawa-select/issues',
            analyticsId:process.env.GA_MEASUREMENT_ID || '',
            amazonAssociateTag:'a0a5f9-22',
            rakuten:null
          };
          fs.writeFileSync('_site/config.js',`window.SITE_CONFIG = ${JSON.stringify(config,null,2)};\n`);
          NODE
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
