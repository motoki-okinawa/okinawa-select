name: Deploy OKINAWA SELECT
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare site with scoped Rakuten credentials
        env:
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: |
          mkdir _site
          cp index.html privacy.html styles.css product-enhancements.css favicon.svg app.js privacy.js products.js rakuten-client.js rakuten-products.js robots.txt sitemap.xml _site/
          cp -r assets _site/assets
          node <<'NODE'
          const fs=require('node:fs');
          const rakuten={
            applicationId:process.env.RAKUTEN_APPLICATION_ID||'',
            accessKey:process.env.RAKUTEN_ACCESS_KEY||'',
            affiliateId:process.env.RAKUTEN_AFFILIATE_ID||''
          };
          if(Object.values(rakuten).some(value=>!value)) throw new Error('Rakuten repository secrets are missing.');
          const config={
            roomUrl:'https://room.rakuten.co.jp/room_d527155c00/items',
            siteUrl:'https://motoki-okinawa.github.io/okinawa-select',
            contactEmail:'',
            contactUrl:'https://github.com/motoki-okinawa/okinawa-select/issues',
            analyticsId:'',
            rakuten
          };
          fs.writeFileSync('_site/config.js',`window.SITE_CONFIG = ${JSON.stringify(config,null,2)};\n`);
          NODE
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
